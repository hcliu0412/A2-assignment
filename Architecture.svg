<path d="M35 452H965" stroke="#c1d0c4"/><text x="35" y="484" class="n">Retry / Apply settings</text><text x="35" y="511" class="s">Rebuild the attempt, close the comparison and clear feedback. History lasts until the page reloads.</text><text x="35" y="536" class="s">Planned evaluation: counterbalanced participant study. The software uses no live model, retrieval service or university records.</text></svg>
