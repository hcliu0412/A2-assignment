<rect width="1000" height="560" fill="#fff"/><text x="26" y="44" style="font:30px Georgia,serif">From a submitted value to an evidence-based decision</text><text x="26" y="73" class="s">Local browser · solid boxes implemented · dashed box simulates the advisor</text>
