<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t desc"><title id="t">BriefCheck system architecture</title><desc id="desc">A submission and two fictional brief versions feed the evaluator. The cited result becomes simulated advice. A learner can optionally inspect the two edition records, including a missing-clause notice. The decision matcher compares the choice with the computed expected action and records feedback in memory.</desc>
